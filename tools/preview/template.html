<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0f0f0f; }
  .card {
    width: 1920px; height: 1080px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 150px 0 140px;
    /* johnveldboom.com: header gray-800 -> dark-900, footer dark-900 -> gray-900 */
    background: linear-gradient(in oklab to bottom,
      oklch(27.8% 0.033 256.848) 0%, #0f0f0f 24%, #0f0f0f 76%, oklch(21% 0.034 264.665) 100%);
    font-family: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .text { align-self: flex-start; padding-top: 110px; }
  h1 {
    margin: 0 0 80px; color: #f2f3f5;
    font-size: 132px; font-weight: 500; line-height: 0.98; letter-spacing: -3px;
  }
  ul { margin: 0; padding: 0; list-style: none; }
  li {
    position: relative; padding-left: 34px; margin: 0 0 22px;
    color: #b7bcc4; font-size: 37px; line-height: 1.3;
  }
  li::before {
    content: ""; position: absolute; left: 2px; top: 19px;
    width: 9px; height: 9px; border-radius: 50%; background: #8fb4e3;
  }
  .panel {
    margin-right: 140px; overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03);
  }
  .panel div { background-repeat: no-repeat; }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <h1>{{title}}</h1>
      <ul>
{{bullets}}
      </ul>
    </div>
    <div class="panel" style="width: {{panel_width}}px">
{{segments}}
    </div>
  </div>
</body>
</html>
